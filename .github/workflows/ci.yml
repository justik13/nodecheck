name: Lint & Validate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Syntax Check (bash -n)
        run: |
          bash -n vpncheck.sh
          bash -n ipregion.sh

  test-run:
    name: Test Execution (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq bsdextrautils iproute2

      - name: Test Help & CLI Options
        run: |
          chmod +x vpncheck.sh ipregion.sh
          ./vpncheck.sh --help
          ./ipregion.sh --help
          ./vpncheck.sh -j
