name: Lint & Validate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: ShellCheck & Syntax
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Syntax Check (bash -n)
        run: |
          bash -n vpncheck.sh
          bash -n ipregion.sh

      - name: Run ShellCheck
        run: |
          shellcheck -S warning -e SC1091 vpncheck.sh ipregion.sh

  test-ubuntu24:
    name: Test Execution (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl jq bsdextrautils iputils-ping iperf3

      - name: Test Help & CLI Options
        run: |
          chmod +x vpncheck.sh ipregion.sh
          ./vpncheck.sh --help
          ./ipregion.sh --help
          ./vpncheck.sh -j
